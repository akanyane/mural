[project]
name = "posts-web"
version = "0.5.0"
description = "Frontend server-side (FastAPI + Jinja2 + HTMX) que consome a posts-api."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.0",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "posts-schemas",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
posts-schemas = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"
